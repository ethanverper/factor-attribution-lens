[project]
name = "factor-attribution-lens"
version = "0.1.0"
description = "Transparent factor-attribution and portfolio-optimization tool built on live OpenBB market data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.4.6",
    "openbb-core>=1.6,<2",
    "openbb-equity>=1.6,<2",
    "openbb-yfinance>=1.6,<2",
    "pandas-datareader>=0.10",
    "pydantic>=2.7",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
