[project]
name = "factor-lens"
version = "0.1.0"
description = "Transparent factor-attribution and portfolio-optimization tool built on live OpenBB market data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "openbb>=4.7,<5",
    "pandas-datareader>=0.10",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
